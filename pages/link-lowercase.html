<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>链接转小写 · Vite 工具集</title>
  <style>
    /* ===== 链接转小写工具专用样式（隔离命名，不影响全局） ===== */
    .link-lowercase-container {
      max-width: 100%;
    }

    .link-lowercase-panel {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      margin-top: 1.2rem;
    }

    .link-lowercase-field {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .link-lowercase-field label {
      font-weight: 600;
      font-size: 1rem;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .link-lowercase-field label .emoji-tag {
      font-size: 1.2rem;
    }

    .link-lowercase-textarea {
      width: 100%;
      min-height: 130px;
      padding: 1rem 1.2rem;
      border-radius: 1rem;
      border: 1.5px solid #e2e8f0;
      background: #f8fafc;
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 0.95rem;
      line-height: 1.7;
      resize: vertical;
      transition: border-color 0.2s, box-shadow 0.2s;
      color: #0b1b2e;
    }

    .link-lowercase-textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      background: #ffffff;
    }

    .link-lowercase-textarea[readonly] {
      background: #f1f5f9;
      border-color: #cbd5e1;
      color: #1e293b;
      cursor: default;
    }

    .link-lowercase-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      margin-top: 0.4rem;
    }

    .btn-link-lowercase {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: #1e293b;
      color: #f8fafc;
      font-weight: 500;
      font-size: 0.95rem;
      padding: 0.7rem 1.8rem;
      border: none;
      border-radius: 2.5rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      font-family: inherit;
      letter-spacing: 0.01em;
    }

    .btn-link-lowercase:hover {
      background: #0f172a;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12);
    }

    .btn-link-lowercase:active {
      transform: scale(0.97);
    }

    .btn-link-lowercase.btn-secondary {
      background: #ffffff;
      color: #1e293b;
      border: 1.5px solid #d1d9e6;
      box-shadow: none;
    }

    .btn-link-lowercase.btn-secondary:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
    }

    .link-lowercase-hint {
      color: #475569;
      font-size: 0.9rem;
      margin-top: 0.2rem;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .link-lowercase-hint .emoji-hint {
      font-size: 1.1rem;
    }

    .link-lowercase-stats {
      margin-left: auto;
      background: #eef2f6;
      padding: 0.25rem 1rem;
      border-radius: 2rem;
      font-size: 0.8rem;
      color: #334155;
      font-weight: 500;
    }

    /* 响应式 */
    @media (max-width: 500px) {
      .link-lowercase-actions {
        flex-direction: column;
        align-items: stretch;
      }
      .btn-link-lowercase {
        width: 100%;
      }
      .link-lowercase-stats {
        margin-left: 0;
        text-align: center;
      }
    }
  </style>
  <script type="module" crossorigin src="/assets/link-lowercase-DHeQqSUF.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/layout-DZqF7D8t.js">
  <link rel="stylesheet" crossorigin href="/assets/layout-B0TkCtSV.css">
</head>
<body>
  <div class="app">
    <!-- 布局挂载点：header 和 footer 将由 layout.js 自动注入 -->
    <main class="main-content">
      <section class="content-section link-lowercase-container">
        <!-- 标题区域 -->
        <div class="section-title">
          🔗 链接转小写
          <span>link-lowercase</span>
        </div>
        <p style="color:#475569; margin-bottom:0.5rem;">
          粘贴任意文本或代码，工具会将其中所有 URL / 链接的 <strong>域名和路径部分</strong> 统一转换为小写。
        </p>

        <!-- 工具主体面板 -->
        <div class="link-lowercase-panel">
          <!-- 输入区 -->
          <div class="link-lowercase-field">
            <label for="input-area">
              <span class="emoji-tag">📋</span> 原始文本 / 链接
            </label>
            <textarea
              id="input-area"
              class="link-lowercase-textarea"
              placeholder="例如：&#10;访问 https://Example.COM/Path/To/Page 和 http://Demo.ORG/ABC?q=Test&#10;&#10;也支持包含多个链接的文本..."
              rows="5"
            ></textarea>
          </div>

          <!-- 输出区（转换后） -->
          <div class="link-lowercase-field">
            <label for="output-area">
              <span class="emoji-tag">✅</span> 转换后（链接已小写）
            </label>
            <textarea
              id="output-area"
              class="link-lowercase-textarea"
              readonly
              placeholder="转换结果将显示在这里..."
              rows="5"
            ></textarea>
          </div>

          <!-- 操作按钮与统计 -->
          <div class="link-lowercase-actions">
            <button id="convert-btn" class="btn-link-lowercase" type="button">
              ⚡ 立即转换
            </button>
            <button id="copy-btn" class="btn-link-lowercase btn-secondary" type="button">
              📋 复制结果
            </button>
            <button id="clear-btn" class="btn-link-lowercase btn-secondary" type="button">
              🧹 清空
            </button>
            <span id="link-count" class="link-lowercase-stats">共转换 0 个链接</span>
          </div>

          <!-- 提示说明 -->
          <div class="link-lowercase-hint">
            <span class="emoji-hint">💡</span>
            <span>仅对链接（http://、https://、ftp:// 等）的域名和路径部分执行小写转换，查询参数（? 之后）保持不变以保持语义。</span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 布局脚本（自动注入 header + footer） -->
</body>
</html>
